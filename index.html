<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>My Lick Library</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;color:#24312e;background:#f3f1eb}*{box-sizing:border-box}body{margin:0}header{background:#213b34;color:white;padding:20px max(16px,calc((100vw - 1120px)/2));display:flex;justify-content:space-between;align-items:center;gap:12px}h1{font-size:22px;margin:0;font-weight:650}header small{color:#bed2c7}main{max-width:1120px;margin:auto;padding:18px 12px 55px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:15px}.btn,button,select,input{font:inherit}button{border:1px solid #b9c7be;border-radius:9px;padding:8px 10px;background:white;color:#24463b;cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}button.active,.primary{background:#244e41;color:white;border-color:#244e41}.page{background:white;border:1px solid #e0e4dd;box-shadow:0 8px 30px #24312e12;border-radius:15px;padding:15px}.pagehead{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:8px}.pagehead strong{font-size:17px}.hint{color:#6c7972;font-size:12px}.lick{border-top:1px solid #e7e9e3;padding:13px 0}.meta,.actions{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.meta{margin-bottom:7px}.number{width:33px;font-weight:bold;color:#688174}.name{flex:1;min-width:145px;font-weight:600;border:0;border-bottom:1px solid #e0e5df;padding:6px}.key,.bpm{width:72px;border:1px solid #dbe2db;border-radius:6px;padding:6px}.score{position:relative;height:111px;border-radius:8px;background:#fcfdfb;border:1px solid #e0e5df;overflow:hidden;touch-action:none}.score svg{width:100%;height:100%;display:block;touch-action:none}.actions{margin-top:8px}.actions button{font-size:12px;padding:7px 9px}.memo{flex:1;min-width:170px;border:0;border-bottom:1px solid #dbe2db;padding:7px;font-size:13px}.status{font-size:12px;color:#65796e}.red{color:#b84040!important;border-color:#e5b4b4!important}.small{font-size:12px}.overlay{position:fixed;inset:0;background:#172820a9;display:none;align-items:center;justify-content:center;padding:15px;z-index:5}.overlay.open{display:flex}.dialog{background:white;border-radius:14px;padding:20px;width:min(640px,100%);max-height:90vh;overflow:auto}.dialog h2{font-size:19px;margin:0 0 10px}.dialog textarea{width:100%;height:125px;padding:10px;border:1px solid #cad4cd;border-radius:8px;font:15px monospace}.dialog p{font-size:13px;color:#58665d;line-height:1.6}.dialog .controls{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}.pill{background:#e5eee8;color:#28503e;border-radius:20px;padding:4px 9px;font-size:11px}@media(max-width:650px){header{padding:16px}main{padding:10px}.page{padding:9px}.score{height:105px}.meta{gap:4px}.key,.bpm{width:61px}.actions{gap:5px}.actions button{padding:6px}.memo{width:100%;flex-basis:100%}}
</style></head><body>
<header><div><h1>My Lick Library</h1><small>1段1フレーズ · 手書き · 録音 · 楽譜再生</small></div><span class="pill">Personal v0.1</span></header>
<main><div class="toolbar"><button id="prev">← 前の10件</button><button id="next">次の10件 →</button><button id="newpage" class="primary">＋ 10件追加</button><button id="backup">バックアップ保存</button><button id="restore">バックアップ読込</button><input type="file" id="restoreFile" accept=".json" hidden></div>
<div class="page"><div class="pagehead"><strong id="pageTitle">Licks 001–010</strong><span class="hint" id="saveStatus">自動保存</span></div><div id="list"></div></div>
<p class="hint">手書きモード：指・Apple Pencilで譜面に描画。音符モード：五線譜をタップして音符を配置（4分音符、左から順に再生）。「音符入力」は手書き認識ではありません。録音・データはこのブラウザ内に保存されます。</p></main>
<div class="overlay" id="modal"><div class="dialog"><h2 id="modalTitle">音符編集</h2><p>音名を半角スペース区切りで入力できます。例：<code>D4 F4 A4 C5 B4 G4 E4</code>。<code>#</code> と <code>b</code> も利用可能です。現在はすべて4分音符です。</p><textarea id="notesText"></textarea><div class="controls"><button id="modalCancel">キャンセル</button><button id="modalSave" class="primary">譜面に反映</button></div></div></div>
<script>
const DB='lick-library-v01', STORE='licks';let db,page=0,entries={},currentModal=null,mode={},drawing=null,recorder=null,recordingId=null,recordChunks=[],audioContext=null,playing=[],audioPlayer=null;
const $=s=>document.querySelector(s);
const defaultLick=id=>({id,name:'',key:'C',bpm:100,memo:'',notes:[],strokes:[],audio:null});
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.createObjectStore(STORE,{keyPath:'id'});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function get(id){return new Promise((res,rej)=>{const t=db.transaction(STORE,'readonly').objectStore(STORE).get(id);t.onsuccess=()=>res(t.result||defaultLick(id));t.onerror=()=>rej(t.error)})}
function put(obj){entries[obj.id]=obj;$('#saveStatus').textContent='保存中…';return new Promise((res,rej)=>{const t=db.transaction(STORE,'readwrite').objectStore(STORE).put(obj);t.onsuccess=()=>{$('#saveStatus').textContent='自動保存済み';res()};t.onerror=()=>rej(t.error)})}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pitchNames=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
function midiToName(m){return pitchNames[m%12]+(Math.floor(m/12)-1)}
function nameToMidi(s){let m=/^([A-Ga-g])([#b]?)(-?\d)$/.exec(s.trim());if(!m)return null;let k={C:0,D:2,E:4,F:5,G:7,A:9,B:11}[m[1].toUpperCase()];return (Number(m[3])+1)*12+k+(m[2]==='#'?1:m[2]==='b'?-1:0)}
function pitchY(m){return 74-(m-60)*2.5}
function yPitch(y){return Math.max(48,Math.min(84,Math.round(60+(74-y)/2.5)))}
function scoreSVG(e){let lines=[35,45,55,65,75].map(y=>`<line x1="12" x2="900" y1="${y}" y2="${y}" stroke="#80928a" stroke-width=".9"/>`).join('');
let notes=e.notes.map((m,i)=>{let x=48+i*30,y=pitchY(m);return `<g><ellipse cx="${x}" cy="${y}" rx="6" ry="4" transform="rotate(-20 ${x} ${y})" fill="#203d33"/><line x1="${x+5}" y1="${y}" x2="${x+5}" y2="${y-26}" stroke="#203d33" stroke-width="1.5"/></g>`}).join('');
let strokes=e.strokes.map(s=>`<polyline points="${s.map(p=>p.join(',')).join(' ')}" fill="none" stroke="#2855a1" stroke-width="2.1" stroke-linejoin="round" stroke-linecap="round"/>`).join('');
return `<svg viewBox="0 0 920 110" preserveAspectRatio="none" data-id="${e.id}">${lines}<text x="17" y="66" font-size="33" fill="#354b40">𝄞</text>${notes}${strokes}</svg>`}
async function render(){const start=page*10+1;$('#pageTitle').textContent=`Licks ${String(start).padStart(3,'0')}–${String(start+9).padStart(3,'0')}`;const arr=await Promise.all(Array.from({length:10},(_,i)=>get(start+i)));arr.forEach(e=>entries[e.id]=e);
$('#list').innerHTML=arr.map(e=>`<section class="lick" data-id="${e.id}"><div class="meta"><span class="number">${String(e.id).padStart(3,'0')}</span><input class="name" data-field="name" placeholder="フレーズ名" value="${esc(e.name)}"><label class="small">Key <input class="key" data-field="key" value="${esc(e.key)}"></label><label class="small">BPM <input class="bpm" data-field="bpm" type="number" min="30" max="300" value="${e.bpm}"></label></div><div class="score">${scoreSVG(e)}</div><div class="actions"><button data-act="draw" class="${mode[e.id]!=='note'?'active':''}">✎ 手書き</button><button data-act="note" class="${mode[e.id]==='note'?'active':''}">♪ 音符配置</button><button data-act="edit">音符編集</button><button data-act="clear">消去</button><button data-act="record" class="${recordingId===e.id?'red':''}">${recordingId===e.id?'■ 録音停止':'● 録音'}</button><button data-act="listen" ${e.audio?'':'disabled'}>▶ 録音再生</button><button data-act="synth" ${e.notes.length?'':'disabled'}>♫ 楽譜再生</button><input class="memo" data-field="memo" placeholder="コード進行・タグ・コピー元・メモ" value="${esc(e.memo)}"></div><span class="status">${e.audio?'録音あり · ':''}${e.notes.length}音 · ${e.strokes.length}筆跡</span></section>`).join('');
document.querySelectorAll('.score svg').forEach(svg=>{svg.addEventListener('pointerdown',pointerDown);svg.addEventListener('pointermove',pointerMove);svg.addEventListener('pointerup',pointerUp);svg.addEventListener('pointercancel',pointerUp)})}
function xy(ev,svg){let r=svg.getBoundingClientRect();return [Math.round((ev.clientX-r.left)/r.width*920),Math.round((ev.clientY-r.top)/r.height*110)]}
function pointerDown(ev){if(ev.pointerType==='mouse'&&ev.button!==0)return;const svg=ev.currentTarget,id=Number(svg.dataset.id),e=entries[id];svg.setPointerCapture(ev.pointerId);let pt=xy(ev,svg);
if(mode[id]==='note'){let pitch=yPitch(pt[1]);e.notes.push(pitch);put(e).then(render);return}
drawing={id,pointer:ev.pointerId,points:[pt],svg};ev.preventDefault()}
function pointerMove(ev){if(!drawing||drawing.pointer!==ev.pointerId)return;drawing.points.push(xy(ev,drawing.svg));const e=entries[drawing.id];let live=drawing.svg.querySelector('.live');if(!live){live=document.createElementNS('http://www.w3.org/2000/svg','polyline');live.setAttribute('class','live');live.setAttribute('fill','none');live.setAttribute('stroke','#2855a1');live.setAttribute('stroke-width','2.1');drawing.svg.appendChild(live)}live.setAttribute('points',drawing.points.map(p=>p.join(',')).join(' '));ev.preventDefault()}
function pointerUp(ev){if(!drawing||drawing.pointer!==ev.pointerId)return;const {id,points}=drawing;drawing=null;entries[id].strokes.push(points);put(entries[id]).then(render)}
document.addEventListener('input',ev=>{let field=ev.target.dataset.field;if(!field)return;let sec=ev.target.closest('.lick');if(!sec)return;let e=entries[Number(sec.dataset.id)];e[field]=field==='bpm'?Math.max(30,Math.min(300,Number(ev.target.value)||100)):ev.target.value;put(e)});
document.addEventListener('click',async ev=>{let btn=ev.target.closest('[data-act]');if(!btn)return;let id=Number(btn.closest('.lick').dataset.id),e=entries[id],a=btn.dataset.act;
if(a==='draw'||a==='note'){mode[id]=a;render()}else if(a==='clear'){if(confirm('この行の手書きと音符を消去しますか？（録音は残ります）')){e.strokes=[];e.notes=[];await put(e);render()}}
else if(a==='edit'){currentModal=id;$('#modalTitle').textContent=`#${String(id).padStart(3,'0')} 音符編集`;$('#notesText').value=e.notes.map(midiToName).join(' ');$('#modal').classList.add('open')}
else if(a==='record')await toggleRecord(id);
else if(a==='listen')listen(e);
else if(a==='synth')synth(e)});
$('#modalCancel').onclick=()=>$('#modal').classList.remove('open');
$('#modalSave').onclick=async()=>{const tokens=$('#notesText').value.trim().split(/\s+/).filter(Boolean),notes=tokens.map(nameToMidi);if(notes.some(x=>x===null)){alert('音名の形式を確認してください（例：C4 F#4 Bb4）');return}let e=entries[currentModal];e.notes=notes;await put(e);$('#modal').classList.remove('open');render()};
async function toggleRecord(id){if(recorder&&recorder.state==='recording'){recorder.stop();return}if(!navigator.mediaDevices?.getUserMedia){alert('録音はHTTPSまたはlocalhost環境で開いてください。');return}try{let stream=await navigator.mediaDevices.getUserMedia({audio:true});recordChunks=[];recorder=new MediaRecorder(stream);recordingId=id;recorder.ondataavailable=ev=>{if(ev.data.size)recordChunks.push(ev.data)};recorder.onstop=async()=>{let blob=new Blob(recordChunks,{type:recorder.mimeType||'audio/webm'});let e=entries[id];e.audio=blob;await put(e);stream.getTracks().forEach(t=>t.stop());recorder=null;recordingId=null;render()};recorder.start();render()}catch(err){alert('マイクを使用できません：'+err.message)}}
function listen(e){if(!e.audio)return;if(audioPlayer){audioPlayer.pause();URL.revokeObjectURL(audioPlayer.src)}let url=URL.createObjectURL(e.audio);audioPlayer=new Audio(url);audioPlayer.onended=()=>URL.revokeObjectURL(url);audioPlayer.play()}
function synth(e){if(!e.notes.length)return;audioContext ||= new (window.AudioContext||window.webkitAudioContext)();audioContext.resume();playing.forEach(o=>{try{o.stop()}catch(_){}});playing=[];let beat=60/(Number(e.bpm)||100),t=audioContext.currentTime+.06;e.notes.forEach((m,i)=>{let osc=audioContext.createOscillator(),gain=audioContext.createGain(),st=t+i*beat;osc.type='triangle';osc.frequency.value=440*Math.pow(2,(m-69)/12);gain.gain.setValueAtTime(.0001,st);gain.gain.exponentialRampToValueAtTime(.17,st+.018);gain.gain.exponentialRampToValueAtTime(.0001,st+beat*.9);osc.connect(gain).connect(audioContext.destination);osc.start(st);osc.stop(st+beat);playing.push(osc)})}
$('#prev').onclick=()=>{page=Math.max(0,page-1);render();window.scrollTo(0,0)};
$('#next').onclick=()=>{page++;render();window.scrollTo(0,0)};
$('#newpage').onclick=()=>{page++;render();window.scrollTo(0,0)};
function toBase64(blob){return new Promise((res,rej)=>{let r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(r.error);r.readAsDataURL(blob)})}
async function backup(){let all=await new Promise((res,rej)=>{let r=db.transaction(STORE,'readonly').objectStore(STORE).getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});for(let e of all)if(e.audio instanceof Blob)e.audio=await toBase64(e.audio);let blob=new Blob([JSON.stringify({version:1,entries:all},null,2)],{type:'application/json'});let url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='my-lick-library-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
$('#backup').onclick=backup;$('#restore').onclick=()=>$('#restoreFile').click();
$('#restoreFile').onchange=async ev=>{let file=ev.target.files[0];if(!file)return;try{let obj=JSON.parse(await file.text());if(!Array.isArray(obj.entries))throw Error('データ形式が違います');if(!confirm(`${obj.entries.length}件を読み込みます。同じ番号のフレーズは上書きされます。続けますか？`))return;for(let e of obj.entries){if(typeof e.audio==='string'&&e.audio.startsWith('data:')){let r=await fetch(e.audio);e.audio=await r.blob()}await put(e)}render();alert('読み込み完了')}catch(err){alert('読み込み失敗：'+err.message)}ev.target.value=''};
(async()=>{try{db=await openDB();render()}catch(err){alert('保存領域を開けませんでした：'+err.message)}})();
</script></body></html>
